name: E2E

on:
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "crates/**"
      - "e2e/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "Cargo.lock"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            webkit2gtk-driver \
            xvfb

      - name: Set up Rust
        run: rustup toolchain install 1.99.0 --profile minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-e2e-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.1.0 --locked

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the end-to-end application
        run: pnpm build:e2e

      # The Tauri service downloads the Microsoft Edge Driver matching WebView2 on Windows.
      - name: Run end-to-end tests (Windows)
        if: runner.os == 'Windows'
        run: pnpm test:e2e

      - name: Run end-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:e2e
