name: E2E

on:
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "crates/**"
      - "e2e/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "Cargo.lock"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Same as the CI Rust job: smaller debug builds, and an equal cache key.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libxdo-dev \
            librsvg2-dev \
            webkitgtk-webdriver \
            xvfb

      - name: Set up Rust
        run: rustup toolchain install 1.99.0 --profile minimal

      # This workflow never runs on main, so it could never save a cache of its own.
      # It reads the debug dependencies the CI Rust job saves on main instead. Only on
      # Windows: on Linux that job runs Clippy and coverage, so its cache holds no
      # reusable debug builds and restoring it costs time without speeding the build.
      - name: Cache Rust dependencies
        if: runner.os == 'Windows'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-rust-${{ matrix.os }}
          save-if: false

      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.1.0 --locked

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the end-to-end application
        run: pnpm build:e2e

      # The runner image's msedgedriver matches its Edge browser, which can be a major
      # version ahead of the WebView2 runtime the app renders with. The Tauri service's
      # own download of a matching driver fails on the runner, so put one first on PATH.
      - name: Install Microsoft Edge Driver matching WebView2
        if: runner.os == 'Windows'
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $webView2 = (Get-ItemProperty -Path $key -Name pv).pv
          if ($webView2 -notmatch '^\d+(\.\d+){3}$') {
            throw "Unexpected WebView2 runtime version: '$webView2'"
          }
          $major = $webView2.Split('.')[0]
          $dir = Join-Path $env:RUNNER_TEMP 'msedgedriver'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $latestFile = Join-Path $dir 'LATEST_RELEASE'
          Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/LATEST_RELEASE_$major" -OutFile $latestFile
          $driver = (Get-Content -Path $latestFile -Raw).Trim()
          if ($driver -notmatch "^$major(\.\d+){3}$") {
            throw "Unexpected msedgedriver version for WebView2 ${webView2}: '$driver'"
          }
          $zip = Join-Path $dir 'edgedriver.zip'
          Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$driver/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          & (Join-Path $dir 'msedgedriver.exe') --version
          Write-Output "WebView2 $webView2 -> msedgedriver $driver"
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      - name: Run end-to-end tests (Windows)
        if: runner.os == 'Windows'
        run: pnpm test:e2e

      - name: Run end-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:e2e

      - name: Upload end-to-end logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-${{ matrix.os }}
          path: e2e/logs/
          if-no-files-found: ignore
          retention-days: 7
