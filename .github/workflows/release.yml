name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      codename: ${{ steps.release.outputs.codename }}
      prefix: ${{ steps.release.outputs.prefix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0

      - name: Validate version and read codename
        id: release
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          import { APP_VERSION, APP_CODENAME } from "./src/lib/app-release.ts";

          const packageVersion = JSON.parse(readFileSync("package.json", "utf8")).version;
          const tauriVersion = JSON.parse(readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
          const cargoVersion = readFileSync("Cargo.toml", "utf8").match(/^version = "([^"]+)"$/m)?.[1];
          if (![packageVersion, tauriVersion, cargoVersion].every(version => version === APP_VERSION)) {
            throw new Error("Release versions do not match");
          }
          if (process.env.GITHUB_REF_NAME !== `v${APP_VERSION}`) {
            throw new Error("Release tag does not match the application version");
          }
          // WiX (MSI) needs a numeric major.minor.patch, with major and minor up to 255
          // and patch up to 65535; fail here instead of after the quality checks.
          const msiVersion = APP_VERSION.match(/^(\d+)\.(\d+)\.(\d+)$/);
          if (!msiVersion || Number(msiVersion[1]) > 255 || Number(msiVersion[2]) > 255 || Number(msiVersion[3]) > 65535) {
            throw new Error(`MSI needs a numeric version (major.minor.patch); got ${APP_VERSION}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, [
            `version=${APP_VERSION}`,
            `codename=${APP_CODENAME}`,
            `prefix=Licht-Launcher-${APP_VERSION}-${APP_CODENAME}`,
            "",
          ].join("\n"));
          NODE

  quality_checks:
    name: Release quality checks
    needs: metadata
    uses: ./.github/workflows/ci.yml
    with:
      skip_tauri_build: true

  build:
    name: Build (${{ matrix.os }})
    needs: [metadata, quality_checks]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_PREFIX: ${{ needs.metadata.outputs.prefix }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: ubuntu-latest
            bundles: appimage,deb

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Set up Rust
        run: rustup toolchain install 1.99.0 --profile minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-${{ matrix.os }}
          save-if: "false"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri application
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --ci --bundles ${{ matrix.bundles }} -- --locked

      - name: Stage Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          # The bundler patches the installer type only into the copies it packages;
          # this executable keeps none, so it reports updates as unavailable.
          Copy-Item "target/release/licht.exe" `
            "release-assets/$env:RELEASE_PREFIX-windows-x64-portable.exe"
          $nsis = Get-ChildItem "target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if (-not $nsis) {
            throw "NSIS installer not found"
          }
          Copy-Item $nsis[0].FullName `
            "release-assets/$env:RELEASE_PREFIX-windows-x64-setup.exe"
          $signature = Get-ChildItem "target/release/bundle/nsis/*.sig" -ErrorAction SilentlyContinue
          if (-not $signature) {
            throw "NSIS updater signature not found"
          }
          Copy-Item $signature[0].FullName `
            "release-assets/$env:RELEASE_PREFIX-windows-x64-setup.exe.sig"
          $msi = Get-ChildItem "target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
          if (-not $msi) {
            throw "MSI installer not found"
          }
          Copy-Item $msi[0].FullName `
            "release-assets/$env:RELEASE_PREFIX-windows-x64.msi"
          $msiSignature = Get-ChildItem "target/release/bundle/msi/*.msi.sig" -ErrorAction SilentlyContinue
          if (-not $msiSignature) {
            throw "MSI updater signature not found"
          }
          Copy-Item $msiSignature[0].FullName `
            "release-assets/$env:RELEASE_PREFIX-windows-x64.msi.sig"

      - name: Stage Linux artifacts
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          appimages=(target/release/bundle/appimage/*.AppImage)
          debs=(target/release/bundle/deb/*.deb)
          if ((${#appimages[@]} == 0)); then
            echo "AppImage not found" >&2
            exit 1
          fi
          if ((${#debs[@]} == 0)); then
            echo "deb package not found" >&2
            exit 1
          fi
          cp "${appimages[0]}" \
            "release-assets/${RELEASE_PREFIX}-linux-x64.AppImage"
          chmod +x "release-assets/${RELEASE_PREFIX}-linux-x64.AppImage"
          if [ ! -f "${appimages[0]}.sig" ]; then
            echo "AppImage updater signature not found" >&2
            exit 1
          fi
          cp "${appimages[0]}.sig" \
            "release-assets/${RELEASE_PREFIX}-linux-x64.AppImage.sig"
          cp "${debs[0]}" \
            "release-assets/${RELEASE_PREFIX}-linux-x64.deb"
          if [ ! -f "${debs[0]}.sig" ]; then
            echo "deb updater signature not found" >&2
            exit 1
          fi
          cp "${debs[0]}.sig" \
            "release-assets/${RELEASE_PREFIX}-linux-x64.deb.sig"

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licht-${{ matrix.os }}
          path: release-assets/*

  flatpak:
    name: Build Flatpak
    needs: [metadata, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_PREFIX: ${{ needs.metadata.outputs.prefix }}
      # Pinned flathub/shared-modules commit that provides libayatana-appindicator for the tray icon.
      SHARED_MODULES_COMMIT: 785a5394b6e430280e24ef393d813e151eb254f4
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Linux artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: licht-ubuntu-latest
          path: linux-assets

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends elfutils flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Fetch Flathub shared modules
        run: |
          git init --quiet flatpak/shared-modules
          git -C flatpak/shared-modules fetch --quiet --depth 1 \
            https://github.com/flathub/shared-modules.git "$SHARED_MODULES_COMMIT"
          git -C flatpak/shared-modules checkout --quiet --detach FETCH_HEAD

      - name: Build Flatpak bundle
        run: |
          cp "linux-assets/${RELEASE_PREFIX}-linux-x64.deb" flatpak/licht-launcher.deb
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --force-clean --repo=flatpak-repo flatpak-build flatpak/app.licht.launcher.yml
          mkdir -p release-assets
          flatpak build-bundle \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo "release-assets/${RELEASE_PREFIX}-linux-x64.flatpak" app.licht.launcher

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licht-flatpak
          path: release-assets/*

  publish:
    name: Publish GitHub Release
    needs: [metadata, quality_checks, build, flatpak]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_PREFIX: ${{ needs.metadata.outputs.prefix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Windows artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: licht-windows-latest
          path: release-assets

      - name: Download Linux artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: licht-ubuntu-latest
          path: release-assets

      - name: Download Flatpak bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: licht-flatpak
          path: release-assets

      - name: Create updater manifest
        shell: bash
        run: |
          windows_signature="$(cat "release-assets/${RELEASE_PREFIX}-windows-x64-setup.exe.sig")"
          windows_msi_signature="$(cat "release-assets/${RELEASE_PREFIX}-windows-x64.msi.sig")"
          linux_signature="$(cat "release-assets/${RELEASE_PREFIX}-linux-x64.AppImage.sig")"
          linux_deb_signature="$(cat "release-assets/${RELEASE_PREFIX}-linux-x64.deb.sig")"
          # The updater looks up "{os}-{arch}-{installer}" before "{os}-{arch}", so MSI and
          # .deb installs update through their own package instead of NSIS or the AppImage.
          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg prefix "$RELEASE_PREFIX" \
            --arg release_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            --arg windows_signature "$windows_signature" \
            --arg windows_msi_signature "$windows_msi_signature" \
            --arg linux_signature "$linux_signature" \
            --arg linux_deb_signature "$linux_deb_signature" \
            '{
              version: $version,
              notes: "See the GitHub release notes for this version.",
              pub_date: (now | strftime("%Y-%m-%dT%H:%M:%SZ")),
              platforms: {
                "windows-x86_64": {
                  signature: $windows_signature,
                  url: ($release_url + "/" + $prefix + "-windows-x64-setup.exe")
                },
                "windows-x86_64-msi": {
                  signature: $windows_msi_signature,
                  url: ($release_url + "/" + $prefix + "-windows-x64.msi")
                },
                "linux-x86_64": {
                  signature: $linux_signature,
                  url: ($release_url + "/" + $prefix + "-linux-x64.AppImage")
                },
                "linux-x86_64-deb": {
                  signature: $linux_deb_signature,
                  url: ($release_url + "/" + $prefix + "-linux-x64.deb")
                }
              }
            }' > release-assets/latest.json

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Licht Launcher ${{ needs.metadata.outputs.version }} · ${{ needs.metadata.outputs.codename }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            **Licht Launcher ${{ needs.metadata.outputs.version }}** (codename **${{ needs.metadata.outputs.codename }}**).

            Unofficial project — not affiliated with Mojang Studios or Microsoft.

            ### Downloads
            | Platform | Portable | Installers |
            | --- | --- | --- |
            | Windows (x64) | `${{ needs.metadata.outputs.prefix }}-windows-x64-portable.exe` | `-windows-x64-setup.exe` (NSIS, current user) and `-windows-x64.msi` (all users) |
            | Linux (x64) | `${{ needs.metadata.outputs.prefix }}-linux-x64.AppImage` | `-linux-x64.deb` and `-linux-x64.flatpak` |

            The Windows portable build and the AppImage run without installation.
            Install the Flatpak bundle with `flatpak install --user <file>.flatpak`; it updates through new bundles, not the in-app updater.
          files: release-assets/*
