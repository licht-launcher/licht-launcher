name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-latest
            bundles: appimage,deb

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Set up Rust
        run: rustup toolchain install 1.99.0 --profile minimal

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri application
        run: pnpm tauri build --ci --bundles ${{ matrix.bundles }} -- --locked

      - name: Stage Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item "target/release/licht.exe" `
            "release-assets/Licht-Launcher-0.1.0-Lilie-windows-x64-portable.exe"
          $nsis = Get-ChildItem "target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if (-not $nsis) {
            throw "NSIS installer not found"
          }
          Copy-Item $nsis[0].FullName `
            "release-assets/Licht-Launcher-0.1.0-Lilie-windows-x64-setup.exe"

      - name: Stage Linux artifacts
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-assets
          cp target/release/licht \
            release-assets/Licht-Launcher-0.1.0-Lilie-linux-x64-portable
          chmod +x release-assets/Licht-Launcher-0.1.0-Lilie-linux-x64-portable
          shopt -s nullglob
          appimages=(target/release/bundle/appimage/*.AppImage)
          debs=(target/release/bundle/deb/*.deb)
          if ((${#appimages[@]} == 0)); then
            echo "AppImage not found" >&2
            exit 1
          fi
          if ((${#debs[@]} == 0)); then
            echo "deb package not found" >&2
            exit 1
          fi
          cp "${appimages[0]}" \
            release-assets/Licht-Launcher-0.1.0-Lilie-linux-x64.AppImage
          chmod +x release-assets/Licht-Launcher-0.1.0-Lilie-linux-x64.AppImage
          cp "${debs[0]}" \
            release-assets/Licht-Launcher-0.1.0-Lilie-linux-x64.deb

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licht-${{ matrix.os }}
          path: release-assets/*

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Windows artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: licht-windows-latest
          path: release-assets

      - name: Download Linux artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: licht-ubuntu-latest
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Licht Launcher 0.1.0 · Lilie
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            First public release of **Licht Launcher** (codename **Lilie**).

            Unofficial project — not affiliated with Mojang Studios or Microsoft.

            ### Downloads
            | Platform | Portable | Installer |
            | --- | --- | --- |
            | Windows (x64) | `Licht-Launcher-0.1.0-Lilie-windows-x64-portable.exe` | `Licht-Launcher-0.1.0-Lilie-windows-x64-setup.exe` (NSIS) |
            | Linux (x64) | `Licht-Launcher-0.1.0-Lilie-linux-x64-portable` | `.AppImage` and `.deb` |

            The portable builds are single binaries; no installer required.
          files: release-assets/*
