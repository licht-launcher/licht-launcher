name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_tauri_build:
        description: Skip the unbundled Tauri build when the caller builds installers
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Frontend checks and rustfmt give the same result on every OS, so they run on Linux
# only; anything that compiles the Rust code runs on both supported platforms.
# Check steps run even when an earlier check failed, so one run reports every problem.
jobs:
  # Pull requests that only touch documentation skip the check jobs. Every other
  # event (push to main, manual runs, release calls) always runs them.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check out repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # A pull request is checked out as a merge commit whose first parent is the base
      # branch, so this diff lists exactly the files the pull request changes. A failing
      # diff fails the job instead of skipping the checks.
      - name: Detect code changes
        id: filter
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
            code=false
            while IFS= read -r file; do
              case "$file" in
                *.md | docs/* | LICENSE) ;;
                *) code=true; break ;;
              esac
            done <<< "$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up toolchains
        id: setup
        uses: ./.github/actions/setup

      - name: Check lint and formatting
        run: pnpm lint

      - name: Check TypeScript types
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm typecheck

      # Vitest adds its GitHub Actions reporter on CI: failure annotations plus a job summary.
      - name: Run tests with coverage
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm test:coverage

      - name: Add coverage to the job summary
        if: ${{ !cancelled() && hashFiles('coverage/summary.txt') != '' }}
        run: |
          {
            echo "### Frontend coverage"
            echo '```'
            cat coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-frontend
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Line tables keep file:line in backtraces but skip full debug info: faster
    # compiles and links, and a build cache about half the size.
    # Keep it equal to the E2E job, which restores this job's cache.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm is needed because the Clippy and test scripts live in package.json.
      - name: Set up toolchains
        id: setup
        uses: ./.github/actions/setup
        with:
          rust: "true"
          rust-components: ${{ runner.os == 'Linux' && 'rustfmt clippy llvm-tools-preview' || 'clippy' }}
          system-deps: "true"
          cache-key: cargo-rust-${{ matrix.os }}

      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Run Clippy
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm lint:rust

      - name: Run Rust tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && runner.os == 'Windows' }}
        run: pnpm test:rust

      # Coverage instrumentation makes builds much slower, so only Linux measures it.
      - name: Install cargo-llvm-cov
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && runner.os == 'Linux' }}
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked

      - name: Run Rust tests with coverage
        id: coverage
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && runner.os == 'Linux' }}
        run: cargo llvm-cov --workspace --locked --no-report

      - name: Build Rust coverage reports
        if: ${{ !cancelled() && steps.coverage.outcome != 'skipped' && runner.os == 'Linux' }}
        run: |
          cargo llvm-cov report --html
          cargo llvm-cov report --json --summary-only --output-path target/llvm-cov/summary.json
          {
            echo "### Rust coverage"
            echo "| Metric | Covered | Total | Percent |"
            echo "| --- | ---: | ---: | ---: |"
            jq -r '.data[0].totals | to_entries[]
              | select(.key == "lines" or .key == "functions" or .key == "regions")
              | "| \(.key) | \(.value.covered) | \(.value.count) | \(.value.percent * 100 | round / 100)% |"' \
              target/llvm-cov/summary.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust
          path: target/llvm-cov/html/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && !inputs.skip_tauri_build }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same key as the release workflow, which restores this cache for its builds.
      - name: Set up toolchains
        uses: ./.github/actions/setup
        with:
          rust: "true"
          system-deps: "true"
          cache-key: cargo-${{ matrix.os }}

      - name: Build Tauri application
        run: pnpm tauri build --ci --no-bundle -- --locked

  # The only check branch protection requires. It passes when every job above
  # succeeded or was skipped, so a new job only has to be added to `needs`.
  # `always()` keeps it running when a job fails or the run is cancelled; a skipped
  # required check would count as passing.
  all-checks:
    name: All checks passed
    if: always()
    needs: [changes, frontend, rust, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "### Job results"
            echo "| Job | Result |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<< "$NEEDS"
          } >> "$GITHUB_STEP_SUMMARY"
          if ! jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS" > /dev/null; then
            echo "::error::At least one job failed or was cancelled."
            exit 1
          fi
