name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_tauri_build:
        description: Skip the unbundled Tauri build when the caller builds installers
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Frontend checks and rustfmt give the same result on every OS, so they run on Linux
# only; anything that compiles the Rust code runs on both supported platforms.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up toolchains
        uses: ./.github/actions/setup

      - name: Check frontend lint and formatting
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up toolchains
        uses: ./.github/actions/setup

      - name: Check TypeScript types
        run: pnpm typecheck

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up toolchains
        uses: ./.github/actions/setup

      # Vitest adds its GitHub Actions reporter on CI: failure annotations plus a job summary.
      - name: Run frontend tests with coverage
        run: pnpm test:coverage

      - name: Add coverage to the job summary
        if: ${{ !cancelled() && hashFiles('coverage/summary.txt') != '' }}
        run: |
          {
            echo "### Frontend coverage"
            echo '```'
            cat coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-frontend
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  rust-format:
    name: Rust format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up toolchains
        uses: ./.github/actions/setup
        with:
          node: "false"
          rust: "true"
          rust-components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm is needed because the Clippy script lives in package.json.
      - name: Set up toolchains
        uses: ./.github/actions/setup
        with:
          rust: "true"
          rust-components: clippy
          system-deps: "true"
          cache-key: cargo-clippy-${{ matrix.os }}

      - name: Run Clippy
        run: pnpm lint:rust

  rust-tests:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up toolchains
        uses: ./.github/actions/setup
        with:
          rust: "true"
          rust-components: ${{ runner.os == 'Linux' && 'llvm-tools-preview' || '' }}
          system-deps: "true"
          cache-key: cargo-test-${{ matrix.os }}

      - name: Run Rust tests
        if: runner.os == 'Windows'
        run: pnpm test:rust

      # Coverage instrumentation makes builds much slower, so only Linux measures it.
      - name: Install cargo-llvm-cov
        if: runner.os == 'Linux'
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked

      - name: Run Rust tests with coverage
        if: runner.os == 'Linux'
        run: cargo llvm-cov --workspace --locked --no-report

      - name: Build Rust coverage reports
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          cargo llvm-cov report --html
          cargo llvm-cov report --json --summary-only --output-path target/llvm-cov/summary.json
          {
            echo "### Rust coverage"
            echo "| Metric | Covered | Total | Percent |"
            echo "| --- | ---: | ---: | ---: |"
            jq -r '.data[0].totals | to_entries[]
              | select(.key == "lines" or .key == "functions" or .key == "regions")
              | "| \(.key) | \(.value.covered) | \(.value.count) | \(.value.percent * 100 | round / 100)% |"' \
              target/llvm-cov/summary.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust
          path: target/llvm-cov/html/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build (${{ matrix.os }})
    if: ${{ !inputs.skip_tauri_build }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same key as the release workflow, which restores this cache for its builds.
      - name: Set up toolchains
        uses: ./.github/actions/setup
        with:
          rust: "true"
          system-deps: "true"
          cache-key: cargo-${{ matrix.os }}

      - name: Build Tauri application
        run: pnpm tauri build --ci --no-bundle -- --locked
