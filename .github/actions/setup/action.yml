name: Set up toolchains
description: Install the Node.js and Rust toolchains and the Linux libraries the Tauri app needs.

inputs:
  node:
    description: Install pnpm, Node.js and the frontend dependencies
    default: "true"
  rust:
    description: Install the Rust toolchain and cache its build output
    default: "false"
  rust-components:
    description: Extra rustup components, separated by spaces
    default: ""
  system-deps:
    description: Install the Linux libraries needed to compile the Tauri app
    default: "false"
  cache-key:
    description: Shared key for the Rust build cache (empty skips it); jobs that compile differently need different keys
    default: ""

runs:
  using: composite
  steps:
    - name: Set up pnpm
      if: inputs.node == 'true'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Set up Node.js
      if: inputs.node == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.21.0
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install Linux system dependencies
      if: inputs.system-deps == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          build-essential \
          pkg-config \
          libwebkit2gtk-4.1-dev \
          libssl-dev \
          libxdo-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev

    - name: Set up Rust
      if: inputs.rust == 'true'
      shell: bash
      env:
        RUST_COMPONENTS: ${{ inputs.rust-components }}
      run: |
        components=()
        for component in $RUST_COMPONENTS; do
          components+=(--component "$component")
        done
        rustup toolchain install 1.99.0 --profile minimal "${components[@]}"

    - name: Cache Rust dependencies
      if: inputs.rust == 'true' && inputs.cache-key != ''
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Install frontend dependencies
      if: inputs.node == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
