[workspace]
members = ["crates/licht-cli", "crates/licht-core", "crates/licht-test-support", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"

# Dependencies build without debug info in dev builds, which keeps target/ about a
# third smaller. Workspace crates keep full debug info for backtraces and debugging.
[profile.dev.package."*"]
debug = false
