# Repackages the .deb produced by `pnpm tauri build --bundles deb`.
# The release workflow copies it to flatpak/licht-launcher.deb.
id: app.licht.launcher
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: licht
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  # OpenGL for the game.
  - --device=dri
  # Keeps custom application directories and Java paths picked in settings usable.
  - --filesystem=home
  # The running process owns this session name; a second launch calls it and exits.
  - --own-name=app.licht.launcher.SingleInstance
  - --talk-name=app.licht.launcher.SingleInstance

modules:
  - name: licht-launcher
    buildsystem: simple
    sources:
      - type: file
        path: licht-launcher.deb
      - type: file
        path: app.licht.launcher.desktop
      - type: file
        path: app.licht.launcher.metainfo.xml
    build-commands:
      - ar x licht-launcher.deb
      - tar -xf data.tar.*
      - install -Dm755 usr/bin/licht /app/bin/licht
      - install -Dm644 app.licht.launcher.desktop /app/share/applications/app.licht.launcher.desktop
      - install -Dm644 app.licht.launcher.metainfo.xml /app/share/metainfo/app.licht.launcher.metainfo.xml
      # Flatpak validates icon dimensions against the directory name, so the
      # high-density "@2" variants Tauri emits are skipped.
      - |
        for icon in usr/share/icons/hicolor/*/apps/licht.png; do
          size="$(basename "$(dirname "$(dirname "$icon")")")"
          case "$size" in *@*) continue ;; esac
          install -Dm644 "$icon" "/app/share/icons/hicolor/${size}/apps/app.licht.launcher.png"
        done
