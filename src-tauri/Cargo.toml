[package]
name = "licht-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "licht_launcher"

[[bin]]
name = "licht"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
anyhow = "=1.0.104"
licht-core = { path = "../crates/licht-core" }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
tauri = { version = "=2.12.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-opener = "=2.7.0"
tauri-plugin-window-controls = "=0.2.1"
tokio = { version = "=1.53.2", features = ["sync"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
