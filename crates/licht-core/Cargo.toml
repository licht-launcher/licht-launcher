[package]
name = "licht-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
directories = "=6.0.0"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
futures-util = "=0.3.34"
md-5 = "=0.10.6"
regex = "=1.13.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha1 = "=0.11.0"
sha2 = { version = "=0.11.0", default-features = false }
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
tar = "=0.4.46"
thiserror = "=2.0.21"
tokio = { version = "=1.53.2", features = ["fs", "io-util", "process", "rt", "sync", "time"] }
tokio-util = { version = "=0.7.19", default-features = false, features = ["io"] }
tracing = "=0.1.44"
ts-rs = "=12.0.1"
uuid = { version = "=1.27.0", features = ["v3"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "=1.53.2", features = ["macros", "net", "rt-multi-thread"] }
